name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "Dockerfile"
      - "Makefile"
      - "RELEASING.md"
      - "cmd/sorolens/**"
      - "internal/buildinfo/**"

# Minimal file-scope permissions; individual jobs request only what they need.
permissions: {}

jobs:
  snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

      - name: Build GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --snapshot --clean

      - name: Assert stamped buildinfo in snapshot binary
        run: |
          BIN="dist/sorolens_linux_amd64_v1/sorolens"
          test -x "$BIN"
          SOURCE_MODE=sorotrail SOROTRAIL_URL=http://127.0.0.1:19999 HTTP_ADDR=127.0.0.1:18080 "$BIN" &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            if OUT=$(curl -sf http://127.0.0.1:18080/api/version); then
              break
            fi
            sleep 0.2
          done
          echo "GET /api/version -> $OUT"
          VERSION=$(echo "$OUT" | jq -r '.version')
          COMMIT=$(echo "$OUT" | jq -r '.commit')
          DATE=$(echo "$OUT" | jq -r '.build_date')
          test -n "$VERSION" && test "$VERSION" != "dev"
          test -n "$COMMIT" && test "$COMMIT" != "none"
          test -n "$DATE" && test "$DATE" != "unknown"

  goreleaser:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'sorotrail/SoroLens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: check

      - name: Release binaries with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assert stamped tag version in release binary
        run: |
          BIN="dist/sorolens_linux_amd64_v1/sorolens"
          test -x "$BIN"
          SOURCE_MODE=sorotrail SOROTRAIL_URL=http://127.0.0.1:19999 HTTP_ADDR=127.0.0.1:18080 "$BIN" &
          PID=$!
          trap "kill $PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            if OUT=$(curl -sf http://127.0.0.1:18080/api/version); then
              break
            fi
            sleep 0.2
          done
          echo "GET /api/version -> $OUT"
          VERSION=$(echo "$OUT" | jq -r '.version')
          COMMIT=$(echo "$OUT" | jq -r '.commit')
          DATE=$(echo "$OUT" | jq -r '.build_date')
          test "$VERSION" = "${GITHUB_REF_NAME}"
          test -n "$COMMIT" && test "$COMMIT" != "none"
          test -n "$DATE" && test "$DATE" != "unknown"

  docker:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'sorotrail/SoroLens'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value={{version}}
            type=raw,value=latest

      - name: Compute build metadata
        id: vars
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.vars.outputs.commit }}
            DATE=${{ steps.vars.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
