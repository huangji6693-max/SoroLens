# GoReleaser configuration for SoroLens multi-platform binary releases.
#
# Usage:
#   goreleaser check                        # validate configuration
#   goreleaser release --snapshot --clean   # local or PR snapshot build
#   goreleaser release --clean              # tag-triggered in CI
#
# Build info ldflags coordinate with internal/buildinfo/buildinfo.go,
# Dockerfile, and the Makefile so every distribution method injects
# the same fields.

project_name: sorolens

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sorolens
    main: ./cmd/sorolens
    binary: sorolens
    ldflags:
      - -s -w
      - -X github.com/sorotrail/sorolens/internal/buildinfo.Version={{ .Tag }}
      - -X github.com/sorotrail/sorolens/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/sorotrail/sorolens/internal/buildinfo.Date={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath

archives:
  - id: default
    formats: ["tar.gz"]
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats: ["zip"]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge conflict"
      - Merge pull request
      - Merge branch
  groups:
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "Maintenance"
      order: 2

release:
  prerelease: auto
  header: |
    ## SoroLens {{ .Tag }}

    See the [README](https://github.com/sorotrail/SoroLens) for installation
    and usage instructions.

    ### Download

    | OS      | Arch   | Archive |
    |---------|--------|---------|
    | Linux   | amd64  | `sorolens_{{ .Version }}_linux_amd64.tar.gz` |
    | Linux   | arm64  | `sorolens_{{ .Version }}_linux_arm64.tar.gz` |
    | macOS   | amd64  | `sorolens_{{ .Version }}_darwin_amd64.tar.gz` |
    | macOS   | arm64  | `sorolens_{{ .Version }}_darwin_arm64.tar.gz` |
    | Windows | amd64  | `sorolens_{{ .Version }}_windows_amd64.zip` |
    | Windows | arm64  | `sorolens_{{ .Version }}_windows_arm64.zip` |
